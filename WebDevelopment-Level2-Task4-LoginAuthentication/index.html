<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to your account in the authentication demo.">
    <title>Login | SecureAccess</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body data-page="login">

    <main class="auth-container">
        <section class="auth-card">
            <div class="brand-mark" aria-hidden="true">SA</div>

            <p class="eyebrow">WELCOME BACK</p>
            <h1>Sign in to your account</h1>
            <p class="subtitle">
                Enter your username or email and password to continue.
            </p>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="loginIdentifier">Username or email</label>
                    <input
                        type="text"
                        id="loginIdentifier"
                        name="identifier"
                        placeholder="Enter username or email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p id="loginMessage" class="form-message" role="status"
                   aria-live="polite"></p>

                <button type="submit" class="primary-button">
                    Login
                </button>
            </form>

            <p class="switch-page">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

            <p class="demo-notice">
                Student project demonstration. Do not use a real password.
            </p>
        </section>
    </main>

</body>
</html>
